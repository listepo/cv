name: ci

# Thin caller of pyrlyn/ci. What runs is .github/infra.yml (Node from mise.toml,
# then npm ci, tests, and the site + PDF build), plus the shared defaults
# (actionlint, CodeQL, Semgrep, the .NET no-op) behind that workflow's gate.
#
# `push` is not limited to main: a workflow file that exists only on a pull
# request head does not run for `pull_request` until it is on the default
# branch. The push of this branch is the run that validates the file first.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: pyrlyn/ci/.github/workflows/ci.yml@6a0d3ef0dc39740c0e4770e4f31af5b4fdfc01f3 # main
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: write
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
