# Node for Astro, the PDF script, and the tests. Major 22 matches the
# Dockerfile (`node:22-bookworm-slim`). CI installs it through mise.
[tools]
node = "22"
"github:jdx/jactionlint" = "2.0.2" # the pre-push hook and local `mise x -- jactionlint`; CI lints through pyrlyn/ci
hk = "2.5.0" # runs jactionlint as a pre-push hook (hk.pkl); `mise x -- hk install --mise`
shellcheck = "0.11.0" # used by jactionlint for run: scripts; CI uses the runner image's copy
